name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check when called by Release
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Check the change is written up
        # Under [Unreleased] with the version left alone, or, for a release
        # PR, a higher version with a dated CHANGELOG section for it.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
          python tools/release.py check --base origin/${{ github.base_ref }}

      - name: Check main is ready to release
        # Before the twenty-minute installer build, not after it.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: python tools/release.py check

      - name: Check every module imports
        run: python run_app.py --selfcheck

      - name: Run the test suite
        # There is no test framework: each file is a script that exits non-zero
        # if any of its own checks failed. Qt needs a platform plugin even for
        # widgets that are never shown.
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem tests\test_*.py | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              # Keep the last completed check and Python stack when a Qt
              # process crashes before its buffered output can be flushed.
              python -u -X faulthandler $_.FullName
              $testExit = $LASTEXITCODE
              if ($testExit -ne 0) {
                  Write-Host "::error::$($_.Name) exited with code $testExit"
                  $failed += $_.Name
              }
          }
          if ($failed.Count -gt 0) {
              Write-Host "::error::failing: $($failed -join ', ')"
              exit 1
          }
          Write-Host "all test files passed"

