name: Release

# A manual run on main prepares, checks, builds and publishes a release.
# Other branches only check and build. Merges never publish automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A queued manual run starts from the latest main, including the
          # metadata committed by an earlier release. Builds pin its output SHA.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare the release version and changelog
        id: commit
        run: |
          python tools/release.py prepare
          python tools/release.py check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/__init__.py CHANGELOG.md
          if ! git diff --cached --quiet; then
            version="$(python tools/release.py version)"
            git commit -m "Prepare release $version"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha || github.sha }}

  installer:
    # The installer every release carries, made the way build.cmd makes it and
    # then used the way a person would on a fresh Windows: installed from an
    # earlier copy, updated over a running one, uninstalled, installed again,
    # with the data checked at every step (tools/check_installer.py). Build
    # only on a manual run: on main before publication, or to check a branch.
    needs: [prepare, tests]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.tests.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          # The Python the release is built with, as on the author's machine.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Make sure Inno Setup is there
        # The runner image has it; this is for the day it does not.
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
          }

      - name: Build the exe and the installer
        shell: cmd
        run: build.cmd installer

      - name: Check the build imports everything
        # With a data folder of its own: the check below wants a machine where
        # the toolkit has never run.
        shell: pwsh
        env:
          WALLPAPER_TOOLKIT_DATA: ${{ runner.temp }}\selfcheck-data
        run: |
          $run = Start-Process -FilePath build\stage\WallpaperEngineToolkit\WallpaperEngineToolkit.exe `
              -ArgumentList '--selfcheck' -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput "$env:RUNNER_TEMP\selfcheck.txt"
          Get-Content "$env:RUNNER_TEMP\selfcheck.txt"
          exit $run.ExitCode

      - name: Install, update, uninstall and install again
        run: python tools/check_installer.py

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    # A manual run on main is a release: tag vX.Y.Z, publish the CHANGELOG
    # section as its notes and attach the installer. A version already released
    # finds its tag there and does nothing, so re-runs are harmless.
    needs: [prepare, tests, installer]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist/installer

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python tools/release.py check
          version="$(python tools/release.py version)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          python tools/release.py notes > notes.md
          gh release create "v$version" --target "$RELEASE_SHA" \
            --title "v$version" --notes-file notes.md \
            "dist/installer/WallpaperEngineToolkit-Setup-$version.exe"
